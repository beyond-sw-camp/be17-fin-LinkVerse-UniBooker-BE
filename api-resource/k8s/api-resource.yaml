apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-resource
  namespace: argocd # ArgoCD가 설치된 네임스페이스
spec:
  project: default
  source:
    repoURL: 'https://github.com/beyond-sw-camp/be17-fin-LinkVerse-UniBooker-BE.git' # 올바른 저장소 루트 URL
    targetRevision: feature/210_msa_integration_main
    path: api-resource/k8s  # Jenkins가 업데이트하는 backend-resource-rollout.yaml이 있는 경로
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: unibooker # 실제 쿠버네티스 배포 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # 이미지 태그 변경은 수동 Sync보다 Git Commit/Push 후 자동 Sync를 권장합니다.
    syncOptions:
      - CreateNamespace=true