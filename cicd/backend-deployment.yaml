apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: linkverseunibooker/backend:latest
          ports:
            - containerPort: 8080

          # ✅ 컨테이너 헬스체크
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /test
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 3

          # ✅ 환경 변수 연결
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          # ✅ 리소스 제한
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

      # ✅ 종료 지연 시간 (빠른 교체용)
      terminationGracePeriodSeconds: 0
