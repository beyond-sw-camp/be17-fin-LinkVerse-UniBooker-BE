apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-reservation
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/beyond-sw-camp/be17-fin-LinkVerse-UniBooker-BE
    targetRevision: develop
    path: api-reservation/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: unibooker

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
