server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ===== WebSocket (필터 없음 - 최우선) =====
        - id: websocket-route
          uri: lb://api-app
          predicates:
            - Path=/ws/**
          # filters 없음 ✅

        # ===== Resource Service =====
        - id: resource-service
          uri: lb://api-resource
          predicates:
            - Path=/api/resource/**,/api/resource-group/**,/api/custom-field/**,/api/category-field/**,/api/timeslot/**
          filters:
            - JwtAuthenticationFilter

        # ===== Reservation Service =====
        - id: reservation-service
          uri: lb://api-reservation
          predicates:
            - Path=/api/reservation/**
          filters:
            - JwtAuthenticationFilter

        # ===== Statistics Service =====
        - id: statistics-service
          uri: lb://api-statistics
          predicates:
            - Path=/api/dashboard/**
          filters:
            - JwtAuthenticationFilter

        # ===== Queue Service =====
        - id: queue-service
          uri: lb://api-queue
          predicates:
            - Path=/api/queues/**
          filters:
            - JwtAuthenticationFilter

        # ===== Main Service (API) =====
        - id: main-service
          uri: lb://api-app
          predicates:
            - Path=/api/**
          filters:
            - JwtAuthenticationFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000
  refresh-token-validity: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.example.apigateway: DEBUG  # ✅ 추가