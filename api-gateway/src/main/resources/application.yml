server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        websocket:
          enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# ===== ✅ SpringDoc 설정 추가 =====
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: API-APP (Main Service)
        url: /api-app/v3/api-docs
      - name: API-RESOURCE
        url: /api-resource/v3/api-docs
      - name: API-RESERVATION
        url: /api-reservation/v3/api-docs
      - name: API-QUEUE
        url: /api-queue/v3/api-docs
      - name: API-STATISTICS
        url: /api-statistics/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.example.apigateway: DEBUG