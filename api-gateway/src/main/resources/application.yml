server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        websocket:
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ===== WebSocket (최우선) =====
        - id: websocket-route
          order: 0
          uri: lb://api-app
          predicates:
            - Path=/ws/**

        # ===== Swagger UI 라우팅 추가 =====
        - id: api-app-swagger-docs
          uri: lb://api-app
          predicates:
            - Path=/api-app/v3/api-docs/**
          filters:
            - RewritePath=/api-app/(?<segment>.*), /${segment}

        - id: api-resource-swagger-docs
          uri: lb://api-resource
          predicates:
            - Path=/api-resource/v3/api-docs/**
          filters:
            - RewritePath=/api-resource/(?<segment>.*), /${segment}

        - id: api-reservation-swagger-docs
          uri: lb://api-reservation
          predicates:
            - Path=/api-reservation/v3/api-docs/**
          filters:
            - RewritePath=/api-reservation/(?<segment>.*), /${segment}

        - id: api-queue-swagger-docs
          uri: lb://api-queue
          predicates:
            - Path=/api-queue/v3/api-docs/**
          filters:
            - RewritePath=/api-queue/(?<segment>.*), /${segment}

        - id: api-statistics-swagger-docs
          uri: lb://api-statistics
          predicates:
            - Path=/api-statistics/v3/api-docs/**
          filters:
            - RewritePath=/api-statistics/(?<segment>.*), /${segment}

        # ===== 기존 라우팅들 =====
        - id: resource-service
          order: -1
          uri: lb://api-resource
          predicates:
            - Path=/api/resource/**,/api/resource-group/**,/api/custom-field/**,/api/category-field/**,/api/timeslot/**
          filters:
            - JwtAuthenticationFilter

        - id: reservation-service
          order: -1
          uri: lb://api-reservation
          predicates:
            - Path=/api/reservation/**
          filters:
            - JwtAuthenticationFilter

        - id: statistics-service
          order: -1
          uri: lb://api-statistics
          predicates:
            - Path=/api/dashboard/**
          filters:
            - JwtAuthenticationFilter

        - id: queue-service
          order: -1
          uri: lb://api-queue
          predicates:
            - Path=/api/queues/**
          filters:
            - JwtAuthenticationFilter

        - id: main-service
          order: 0
          uri: lb://api-app
          predicates:
            - Path=/api/**
          filters:
            - JwtAuthenticationFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# ===== ✅ SpringDoc 설정 추가 =====
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: API-APP (Main Service)
        url: /api-app/v3/api-docs
      - name: API-RESOURCE
        url: /api-resource/v3/api-docs
      - name: API-RESERVATION
        url: /api-reservation/v3/api-docs
      - name: API-QUEUE
        url: /api-queue/v3/api-docs
      - name: API-STATISTICS
        url: /api-statistics/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.example.apigateway: DEBUG