# =================================================================
# Spring Boot 기본 설정
# =================================================================
spring:
  application:
    name: unibooker

  # =================================================================
  # 데이터베이스 설정
  # =================================================================
  datasource:
    url: ${DB_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # SQL 초기화 설정
  sql:
    init:
      mode: always

  # =================================================================
  # JPA/Hibernate 설정
  # =================================================================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_OPTION}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # =================================================================
  # 이메일 설정 (Gmail SMTP)
  # =================================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true
          timeout: 5000

  # =================================================================
  # Thymeleaf 설정
  # =================================================================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # =================================================================
  # AWS 클라우드 설정 (S3) - (여기로 모두 병합)
  # =================================================================
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        bucket: ${MY_BUCKET}
      region:
        static: ${AWS_REGION}
# ===== (주의: 중복되었던 cloud: 블록은 삭제됨) =====

# =================================================================
# 파일 업로드 설정
# =================================================================
file:
  upload:
    path: uploads/
    company-logo-path: company/logos/
    max-size: 5242880

# =================================================================
# JWT 토큰 설정
# =================================================================
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 86400000       # 1일
  refresh-token-validity: 604800000   # 7일

# =================================================================
# 앱 설정
# =================================================================
app:
  mail:
    from: noreply@unibooker.com
    login-url: https://unibooker.com/login

  account-cleanup:
    enabled: true
    inactive-minutes: 4320
    cron: "0 0 2  * * *"

# =================================================================
# 서버 설정
# =================================================================
server:
  servlet:
    session:
      cookie:
        same-site: strict
        secure: false
        http-only: true

