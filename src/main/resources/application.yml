# =================================================================
# Spring Boot 기본 설정
# =================================================================
spring:
  application:
    name: unibooker

  # =================================================================
  # 데이터베이스 설정
  # =================================================================
  datasource:
    url: ${DB_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # SQL 초기화 설정
  sql:
    init:
      mode: always

  # =================================================================
  # JPA/Hibernate 설정
  # =================================================================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_OPTION}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # =================================================================
  # 이메일 설정 (Gmail SMTP) - 여기로 이동!
  # =================================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true
          timeout: 5000

  # =================================================================
  # Thymeleaf 설정
  # =================================================================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # 개발: false, 프로덕션: true

  # =================================================================
  # AWS 클라우드 설정 (S3)
  # =================================================================
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        bucket: ${MY_BUCKET}
      region:
        static: ${AWS_REGION}

  # =================================================================
  # Spring Batch 자동 실행 방지 설정
  # =================================================================
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

# =================================================================
# 파일 업로드 설정
# =================================================================
file:
  upload:
    path: uploads/
    company-logo-path: company/logos/
    max-size: 5242880

# =================================================================
# AWS 클라우드 설정 (S3)
# =================================================================
cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    s3:
      bucket: ${MY_BUCKET}
    region:
      static: ${AWS_REGION}

# =================================================================
# JWT 토큰 설정
# =================================================================
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 86400000       # 1일 (24 * 60 * 60 * 1000)
  refresh-token-validity: 604800000   # 7일 (7 * 24 * 60 * 60 * 1000)

# =================================================================
# 앱 설정
# =================================================================
app:
  mail:
    from: noreply@unibooker.com
    login-url: https://unibooker.com/login

  account-cleanup:
    enabled: true                    # 자동 삭제 기능 활성화 여부
    inactive-minutes: 4320               # 미활성 기준 시간 (72시간 = 3일)
    cron: "0 0 2  * * *"             # 매일 새벽 2시 실행

# =================================================================
# 서버 설정
# =================================================================
server:
  servlet:
    session:
      cookie:
        same-site: strict
        secure: false  # 개발: false, 운영: true (HTTPS 필수)
        http-only: true

# =================================================================
# Redis 설정 (TODO: Redis 연동 시 활성화)
# =================================================================
# spring:
#   data:
#     redis:
#       host: localhost
#       port: 6379
#       password: ${REDIS_PASSWORD}
#       database: 0  # Refresh Token용


# =================================================================
# Actuator
# =================================================================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always