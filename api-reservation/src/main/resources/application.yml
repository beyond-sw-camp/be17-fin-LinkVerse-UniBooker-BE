server:
  port: 8082


spring:
  application:
    name: api-reservation

  # =================================================================
  # 데이터베이스 설정
  # =================================================================
  datasource:
    url: ${RESERVATION_DB_URL}
    username: ${RESERVATION_DB_USERNAME}
    password: ${RESERVATION_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver


  # =================================================================
  # JPA/Hibernate 설정
  # =================================================================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_OPTION:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # =================================================================
  # Kafka 설정 (신규 추가)
  # =================================================================
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: reservation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
      auto-commit-interval: 1000


  # =================================================================
  # AWS 클라우드 설정 (S3)
  # =================================================================
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        bucket: ${MY_BUCKET}
      region:
        static: ${AWS_REGION}

  # =================================================================
  # Redis 설정
  # =================================================================
  data:
    redis:
      sentinel:
        master: ${REDIS_MASTER_NAME}
        nodes:
          - ${REDIS_SENTINEL_1}
          - ${REDIS_SENTINEL_2}
          - ${REDIS_SENTINEL_3}
      timeout: ${REDIS_TIMEOUT}

reservation:
  lock:
    wait-seconds: ${RESERVATION_WAIT:3}
    lease-seconds: ${RESERVATION_LEASE:15}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

# =================================================================
# Actuator 설정
# =================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# 스웨거 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false  # ← UI는 Gateway에서만!