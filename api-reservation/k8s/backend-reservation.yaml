apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reservation-rollout
  namespace: unibooker
spec:
  replicas: 1
  strategy:
    blueGreen:
      activeService: backend-reservation-service
      previewService: backend-reservation-preview
      autoPromotionEnabled: true
  selector:
    matchLabels:
      app: reservation
  template:
    metadata:
      labels:
        app: reservation
    spec:
      containers:
        - name: reservation
          image: linkverseunibooker/reservation:1
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 5
