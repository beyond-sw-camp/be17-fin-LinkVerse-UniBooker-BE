apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reservation-rollout
  namespace: unibooker
spec:
  replicas: 1

  strategy:
    blueGreen:
      activeService: backend-reservation-service
      previewService: backend-reservation-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30

  selector:
    matchLabels:
      app: reservation

  template:
    metadata:
      labels:
        app: reservation

    spec:
      containers:
        - name: reservation
          image: linkverseunibooker/reservation:1
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: backend-reservation-config
            - secretRef:
                name: backend-reservation-secret

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
