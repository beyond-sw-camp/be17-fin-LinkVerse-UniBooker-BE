apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: unibooker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: linkverseunibooker/app:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: backend-app-config
            - secretRef:
                name: backend-app-secret
          resources:
            limits:
              cpu: "500m"
              memory: "768Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
