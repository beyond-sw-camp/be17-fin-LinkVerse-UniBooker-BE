server:
  port: 8085

spring:
  application:
    name: api-app

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # Mail 설정 (Gmail 사용)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: api-app-group  # ← main-service-group → api-app-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9090/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}


# JWT 설정
jwt:
  secret: ${JWT_SECRET:unibooker-secret-key-2024-linkverse-project-development}
  access-token-validity: 3600000      # 1시간
  refresh-token-validity: 604800000   # 7일

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Logging
logging:
  level:
    org.example.apimain: DEBUG  # ← com.unibooker.main → org.example.apimain
    org.hibernate.SQL: DEBUG

# App 설정
app:
  mail:
    login-url: http://localhost:8080/login
    from: ${GMAIL_USERNAME}

  batch:
    # Refresh Token 정리 배치 설정
    token-cleanup:
      enabled: true
      cron: "0 0 2 * * ?"              # 매일 새벽 2시
      retention-days: 7

    # 미활성 계정 정리 배치 설정
    inactive-account:
      enabled: true
      cron: "0 0 2 ? * MON"            # 매주 월요일 새벽 2시
      inactive-minutes: 4320           # 3일 = 4320분

    # 거절된 기업 정리 배치 설정
    rejected-company:
      enabled: true
      cron: "0 0 2 ? * MON"            # 매주 월요일 새벽 2시
      retention-days: 3

    # ADMIN_PENDING 만료 기업 정지 배치
    admin-pending:
      enabled: true              # 배치 활성화 여부
      cron: "0 0 0 * * *"        # 매일 자정 실행

# AWS S3 설정
aws:
  s3:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${MY_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}

# 파일 업로드 설정
file:
  upload:
    max-size: 5242880  # 5MB